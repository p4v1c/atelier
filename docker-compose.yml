services:
  db:
    image: postgres:16-alpine
    container_name: la-regle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laregle
      POSTGRES_PASSWORD: laregle
      POSTGRES_DB: laregle
    ports:
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laregle -d laregle"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Profil « prod » : ne démarre qu'avec `docker compose --profile prod up -d`.
  app:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://laregle:laregle@db:5432/laregle?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  db-data:
