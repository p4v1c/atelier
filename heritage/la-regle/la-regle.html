<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Règle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,ital,wght@6..96,0,400;6..96,0,500;6..96,1,400&family=Karla:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
  :root{
    --encre:#16112E; --encre-2:#211A44; --encre-3:#2C2456;
    --papier:#F7F3E8; --seyes:#B9CCE8; --rouge:#D6302A;
    --vert:#3E9E6E; --craie:#EDE8F5; --mauve:#9084C9; --or:#E3B04B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--encre);
    background-image:radial-gradient(120% 90% at 50% -10%, #2A2158 0%, #16112E 60%);
    background-attachment:fixed;
    color:var(--craie); font-family:'Karla',system-ui,sans-serif;
    min-height:100vh; padding:26px 20px 60px; display:flex; justify-content:center;
  }
  .app{width:100%;max-width:680px}

  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mauve);font-weight:700;margin:0 0 8px}
  h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:38px;line-height:1;margin:0 0 4px;color:var(--papier)}
  h1 em{font-style:italic}
  .sub{color:var(--mauve);font-size:14px;margin:0 0 26px;line-height:1.6}
  .entete{margin-bottom:26px}

  /* jauge de session */
  .jauge{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .barre{flex:1;height:2px;background:var(--encre-3);position:relative;overflow:hidden}
  .barre span{position:absolute;inset:0 auto 0 0;width:0%;background:var(--seyes);transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .compte{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve);font-weight:700;white-space:nowrap}
  .compte b{color:var(--papier)}

  /* cahier */
  .cahier{position:relative;background:var(--papier);border-radius:2px;padding:38px 30px 34px;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.65)}
  .cahier::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:2px;
    background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--seyes) 27px 28px);opacity:.35}
  .marge{position:absolute;top:0;bottom:0;left:22px;width:1px;background:#E0A9A4;opacity:.8}
  .categorie{position:relative;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#8A7FA8;margin:0 0 18px}
  .phrase{position:relative;font-family:'Bodoni Moda',serif;font-size:27px;line-height:56px;color:#1D1836}
  .mot{font:inherit;color:inherit;background:none;border:0;padding:0 1px;margin:0;cursor:pointer;border-radius:2px;transition:background .15s,color .15s}
  .mot:hover{background:rgba(214,48,42,.1)}
  .mot:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}
  .fige .mot{cursor:default}
  .fige .mot:hover{background:none}
  .mot.rate{color:#9A93AC;text-decoration:line-through;text-decoration-color:#C9C2D8}
  .calque{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .trait{fill:none;stroke:var(--rouge);stroke-width:2.4;stroke-linecap:round;animation:tracer .55s cubic-bezier(.4,0,.3,1) forwards}
  @keyframes tracer{to{stroke-dashoffset:0}}
  .annote{position:absolute;font-family:'Caveat',cursive;font-size:26px;color:var(--rouge);
    transform:translate(-50%,-100%) rotate(-3deg);white-space:nowrap;opacity:0;animation:apparait .3s .45s forwards}
  @keyframes apparait{to{opacity:1}}

  .consigne{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;flex-wrap:wrap}
  .indice{font-size:13px;color:var(--mauve);margin:0}

  /* boutons */
  button{font-family:'Karla',sans-serif}
  .creux{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--craie);
    background:none;border:1px solid var(--encre-3);border-radius:999px;padding:11px 20px;cursor:pointer;
    transition:border-color .18s,color .18s}
  .creux:hover{border-color:var(--seyes);color:#fff}
  .creux:focus-visible{outline:2px solid var(--seyes);outline-offset:3px}
  .creux[disabled]{opacity:.3;cursor:default}
  .plein{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--encre);
    background:var(--papier);border:0;border-radius:999px;padding:13px 26px;cursor:pointer}
  .plein:hover{background:#fff}
  .plein:focus-visible{outline:2px solid var(--seyes);outline-offset:3px}

  /* règle */
  .regle{margin-top:18px;background:var(--encre-2);border-left:3px solid var(--rouge);padding:22px 24px;border-radius:0 3px 3px 0;
    animation:monte .32s cubic-bezier(.2,.8,.2,1)}
  .regle.juste{border-left-color:var(--vert)}
  @keyframes monte{from{opacity:0;transform:translateY(10px)}}
  .verdict{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--rouge);margin:0 0 10px;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .regle.juste .verdict{color:var(--vert)}
  .verdict .palier{color:var(--mauve);letter-spacing:.1em}
  .regle h2{font-family:'Bodoni Moda',serif;font-weight:500;font-size:21px;margin:0 0 8px;color:var(--papier)}
  .regle p{margin:0;font-size:15px;line-height:1.65;color:#C6BEE0}
  .regle p b{color:var(--papier)}
  .astuce{margin-top:12px!important;padding-left:14px;border-left:1px solid var(--encre-3);font-style:italic;color:var(--mauve)!important}
  .suite{display:block;margin:20px 0 0 auto}

  /* accueil */
  .carte{background:var(--encre-2);border-radius:3px;padding:26px 28px;margin-bottom:16px}
  .niveau{display:flex;align-items:baseline;gap:14px;margin:0 0 4px}
  .niveau b{font-family:'Bodoni Moda',serif;font-weight:400;font-size:30px;color:var(--papier)}
  .niveau span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve);font-weight:700}
  .anneau{height:3px;background:var(--encre-3);margin:16px 0 10px}
  .anneau i{display:block;height:100%;background:var(--or);transition:width .6s}
  .legende{font-size:13px;color:var(--mauve);margin:0}
  .menu{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media(max-width:560px){.menu{grid-template-columns:1fr}}
  .tuile{text-align:left;background:var(--encre-2);border:1px solid transparent;border-radius:3px;padding:20px 22px;cursor:pointer;
    transition:border-color .18s,background .18s;color:var(--craie)}
  .tuile:hover{border-color:var(--encre-3);background:var(--encre-3)}
  .tuile:focus-visible{outline:2px solid var(--seyes);outline-offset:2px}
  .tuile b{display:block;font-family:'Bodoni Moda',serif;font-weight:500;font-size:19px;color:var(--papier);margin-bottom:4px}
  .tuile span{font-size:13px;color:var(--mauve);line-height:1.5}
  .tuile[disabled]{opacity:.4;cursor:default}
  .bas{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .lien{background:none;border:0;color:var(--mauve);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:700;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
  .lien:hover{color:var(--craie)}

  /* stats */
  .ligne{margin-bottom:14px}
  .ligne .tete{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:6px}
  .ligne .tete span:last-child{color:var(--mauve);white-space:nowrap}
  .piste{height:3px;background:var(--encre-3)}
  .piste i{display:block;height:100%;background:var(--seyes);transition:width .5s}
  .piste i.fort{background:var(--vert)}
  .piste i.faible{background:var(--rouge)}
  .note{font-family:'Bodoni Moda',serif;font-size:64px;line-height:1;color:var(--papier);margin:0}
  .note small{font-size:22px;color:var(--mauve)}
  h3{font-family:'Bodoni Moda',serif;font-weight:500;font-size:20px;color:var(--papier);margin:28px 0 14px}
  h3:first-child{margin-top:0}

  /* dictée */
  .ardoise{background:var(--papier);border-radius:2px;padding:30px;position:relative}
  .ardoise textarea{width:100%;min-height:120px;border:0;background:transparent;resize:vertical;
    font-family:'Bodoni Moda',serif;font-size:22px;line-height:34px;color:#1D1836;outline:none}
  .ardoise textarea::placeholder{color:#B7AFC9}
  .correction{font-family:'Bodoni Moda',serif;font-size:22px;line-height:40px;color:#1D1836}
  .correction .ok{color:#1D1836}
  .correction .ko{color:var(--rouge);text-decoration:line-through;text-decoration-thickness:1px;margin-right:6px}
  .correction .vrai{color:var(--vert)}
  .haut-parleur{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .avert{font-size:13px;color:var(--or);margin:14px 0 0}

  @media(max-width:520px){
    .phrase{font-size:22px;line-height:44px}
    .cahier{padding:30px 20px 26px}
    h1{font-size:30px}
    body{padding:20px 14px 50px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.001s!important}
    .trait{stroke-dashoffset:0!important}
    .annote{opacity:1}
  }
</style>

<div class="app">
  <div class="entete">
    <p class="eyebrow" id="fil">Entraînement personnel</p>
    <h1>La <em>Règle</em></h1>
    <p class="sub" id="accroche">Repérer la faute, comprendre pourquoi, ne plus la refaire.</p>
  </div>
  <div id="scene"></div>
</div>


<style>
  .etiquette{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--mauve);margin:0 0 12px}
  .puces{display:flex;flex-wrap:wrap;gap:8px}
  .puce{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--encre-3);
    border-radius:999px;padding:9px 15px;font-size:13px;color:var(--craie);cursor:pointer;transition:border-color .18s,background .18s}
  .puce:hover{border-color:var(--seyes)}
  .puce:focus-visible{outline:2px solid var(--seyes);outline-offset:2px}
  .puce.active{background:var(--papier);border-color:var(--papier);color:var(--encre);font-weight:700}
  .puce i{font-style:normal;font-size:11px;opacity:.65;letter-spacing:.04em}
  .fiche{padding:16px 0;border-bottom:1px solid var(--encre-3)}
  .fiche:last-child{border-bottom:0;padding-bottom:0}
  .fiche-t{font-family:'Bodoni Moda',serif;font-size:18px;color:var(--papier);margin:0 0 6px}
  .fiche-t em{font-style:normal;font-size:9px;color:var(--or);letter-spacing:2px;vertical-align:middle}
  .fiche-e{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mauve);margin:10px 0 0;font-weight:700}
</style>

<script>
/* ═══════════ BANQUE DE RÈGLES ═══════════ */
const REGLES = [
/* ─── HOMOPHONES GRAMMATICAUX ─── */
 {id:"a-à", cat:"Homophones", n:1, t:"a ou à",
  r:"<b>a</b> est le verbe avoir conjugué, <b>à</b> est une préposition invariable.",
  astuce:"Remplace par « avait ». Si la phrase tient, c'est « a ».",
  p:[{s:"Il commence [a] comprendre la règle.", fix:"à"},
     {s:"Elle [à] beaucoup travaillé cette semaine.", fix:"a"},
     {s:"Ce chien [à] mordu le facteur.", fix:"a"},
     {s:"Il a promis à sa sœur de venir demain.", fix:null}]},

 {id:"ou-où", cat:"Homophones", n:1, t:"ou ou où",
  r:"<b>ou</b> propose un choix, <b>où</b> indique le lieu ou le moment.",
  astuce:"Remplace par « ou bien ». Si ça marche, pas d'accent.",
  p:[{s:"Je ne sais pas [ou] il est parti hier.", fix:"où"},
     {s:"Le jour [ou] je l'ai rencontré, il pleuvait.", fix:"où"},
     {s:"Tu préfères le thé ou le café ?", fix:null}]},

 {id:"ce-se", cat:"Homophones", n:1, t:"ce ou se",
  r:"<b>ce</b> accompagne un nom, <b>se</b> accompagne un verbe pronominal.",
  astuce:"Remplace par « me » ou « te ». Si ça marche, c'est « se ».",
  p:[{s:"[Se] livre est vraiment passionnant.", fix:"Ce"},
     {s:"Il [ce] demande si la réponse est bonne.", fix:"se"},
     {s:"Elle [ce] souvient très bien de lui.", fix:"se"},
     {s:"Ce matin, il se lève avant tout le monde.", fix:null}]},

 {id:"ces-ses", cat:"Homophones", n:1, t:"ces ou ses",
  r:"<b>ces</b> montre (démonstratif), <b>ses</b> possède (possessif).",
  astuce:"Ajoute « -là » au nom. Si ça sonne juste, c'est « ces ».",
  p:[{s:"[Ses] gens-là ne me plaisent pas du tout.", fix:"Ces"},
     {s:"Chacun range [ces] affaires avant de partir.", fix:"ses"},
     {s:"Il a rangé ses affaires dans ces cartons.", fix:null}]},

 {id:"leur", cat:"Homophones", n:1, t:"leur ou leurs",
  r:"Devant un verbe, <b>leur</b> est un pronom (= à eux) et ne prend jamais de s. Devant un nom, c'est un déterminant qui s'accorde.",
  astuce:"Remplace par « lui ». Si ça marche, c'est « leur » sans s.",
  p:[{s:"Je [leurs] ai dit la vérité hier soir.", fix:"leur"},
     {s:"Ils ont oublié [leur] manteaux au vestiaire.", fix:"leurs"},
     {s:"Le professeur [leurs] a rendu les copies.", fix:"leur"},
     {s:"Ils ont pris leurs affaires et je leur ai ouvert.", fix:null}]},

 {id:"on-ont", cat:"Homophones", n:1, t:"on ou ont",
  r:"<b>on</b> est un pronom sujet, <b>ont</b> est le verbe avoir au pluriel.",
  astuce:"Mets à l'imparfait : « avaient » donne ont, « il » donne on.",
  p:[{s:"Ils [on] terminé le travail avant midi.", fix:"ont"},
     {s:"Les voisins [on] encore fait du bruit.", fix:"ont"},
     {s:"On a compris ce qu'ils ont voulu dire.", fix:null}]},

 {id:"son-sont", cat:"Homophones", n:1, t:"son ou sont",
  r:"<b>son</b> est un possessif, <b>sont</b> est le verbe être au pluriel.",
  astuce:"Remplace par « étaient » : si ça tient, c'est « sont ».",
  p:[{s:"Les enfants [son] arrivés en avance.", fix:"sont"},
     {s:"Il a oublié [sont] parapluie au bureau.", fix:"son"},
     {s:"Son frère et sa sœur sont déjà partis.", fix:null}]},

 {id:"et-est", cat:"Homophones", n:1, t:"et ou est",
  r:"<b>et</b> relie deux éléments, <b>est</b> est le verbe être.",
  astuce:"Remplace par « était » : si ça marche, c'est « est ».",
  p:[{s:"Mon frère [et] plus grand que moi.", fix:"est"},
     {s:"Il est fatigué [est] il rentre.", fix:"et"},
     {s:"Elle est prête et son sac est bouclé.", fix:null}]},

 {id:"ni-ny", cat:"Homophones", n:2, t:"ni ou n'y",
  r:"<b>ni</b> est une conjonction de négation, <b>n'y</b> est la négation « ne » suivie du pronom « y ».",
  astuce:"Remplace par « ne… pas à cela ». Si ça marche, c'est « n'y ».",
  p:[{s:"Il [ni] pense même pas une seconde.", fix:"n'y"},
     {s:"Je [n'y] veux ni sucre ni lait.", fix:"ne"},
     {s:"Il n'y a ni sel ni poivre sur la table.", fix:null}]},

 {id:"si-sy", cat:"Homophones", n:2, t:"si ou s'y",
  r:"<b>si</b> introduit une condition, <b>s'y</b> est le pronom « se » suivi de « y ».",
  astuce:"Remplace par « se… à cela ». Si ça marche, c'est « s'y ».",
  p:[{s:"Il [si] est pris beaucoup trop tard.", fix:"s'y"},
     {s:"Elle [si] connaît mieux que personne.", fix:"s'y"},
     {s:"Si tu veux, il s'y mettra demain.", fix:null}]},

 {id:"la-là-la", cat:"Homophones", n:2, t:"la, là ou l'a",
  r:"<b>la</b> est un déterminant ou un pronom, <b>là</b> indique le lieu, <b>l'a</b> contient le verbe avoir.",
  astuce:"« l'a » se remplace par « l'avait », « là » par « ici ».",
  p:[{s:"Il [la] rangée dans le tiroir du bas.", fix:"l'a"},
     {s:"Pose le carton [la], contre le mur.", fix:"là"},
     {s:"Elle l'a posée là, sur la table.", fix:null}]},

 {id:"cest-sest", cat:"Homophones", n:2, t:"c'est ou s'est",
  r:"<b>c'est</b> équivaut à « cela est », <b>s'est</b> accompagne un verbe pronominal.",
  astuce:"Remplace par « cela est ». Si ça ne marche pas, c'est « s'est ».",
  p:[{s:"Il [c'est] trompé de chemin deux fois.", fix:"s'est"},
     {s:"[S'est] une très bonne nouvelle.", fix:"C'est"},
     {s:"C'est vrai qu'il s'est trompé.", fix:null}]},

 {id:"sais-sait", cat:"Homophones", n:2, t:"sais, sait ou c'est",
  r:"<b>sais</b> et <b>sait</b> viennent du verbe savoir, <b>c'est</b> équivaut à « cela est ».",
  astuce:"Remplace par « savait » : si ça marche, c'est le verbe savoir.",
  p:[{s:"Personne ne [c'est] où il est passé.", fix:"sait"},
     {s:"Je ne [c'est] pas quoi répondre.", fix:"sais"},
     {s:"C'est étrange, personne ne sait pourquoi.", fix:null}]},

 {id:"ça-sa", cat:"Homophones", n:1, t:"ça ou sa",
  r:"<b>ça</b> équivaut à « cela », <b>sa</b> est un possessif féminin.",
  astuce:"Remplace par « cela » : si ça marche, c'est « ça ».",
  p:[{s:"Il a repris [ça] veste au vestiaire.", fix:"sa"},
     {s:"[Sa] ne me dérange pas du tout.", fix:"Ça"},
     {s:"Ça ne va pas, sa voiture est en panne.", fix:null}]},

 {id:"quand-quant", cat:"Homophones", n:2, t:"quand, quant ou qu'en",
  r:"<b>quand</b> marque le temps, <b>quant à</b> signifie « en ce qui concerne », <b>qu'en</b> contient « que » et « en ».",
  astuce:"« quant » est toujours suivi de à, au ou aux.",
  p:[{s:"[Quant] tu voudras, préviens-moi.", fix:"Quand"},
     {s:"[Quand] à moi, je préfère rester ici.", fix:"Quant"},
     {s:"Quant à lui, il partira quand il pourra.", fix:null}]},

 {id:"quelle-quelle", cat:"Homophones", n:2, t:"quelle ou qu'elle",
  r:"<b>quelle</b> accompagne un nom, <b>qu'elle</b> contient le pronom « elle ».",
  astuce:"Remplace par « qu'il » : si ça marche, c'est « qu'elle ».",
  p:[{s:"Je crois [quelle] viendra demain matin.", fix:"qu'elle"},
     {s:"Tu sais [qu'elle] heure il est ?", fix:"quelle"},
     {s:"Quelle heure est-il ? Je crois qu'elle arrive.", fix:null}]},

 {id:"peu-peut", cat:"Homophones", n:1, t:"peu, peux ou peut",
  r:"<b>peu</b> est un adverbe de quantité, <b>peux</b> et <b>peut</b> viennent du verbe pouvoir.",
  astuce:"Remplace par « pouvait » : si ça marche, c'est le verbe.",
  p:[{s:"Il [peu] venir dès ce soir.", fix:"peut"},
     {s:"Ajoute un [peut] de sel dans la sauce.", fix:"peu"},
     {s:"Je peux dormir un peu plus longtemps.", fix:null}]},

 {id:"plutot", cat:"Homophones", n:2, t:"plutôt ou plus tôt",
  r:"<b>plutôt</b> exprime une préférence, <b>plus tôt</b> est le contraire de « plus tard ».",
  astuce:"Oppose à « plus tard » : si ça fonctionne, deux mots.",
  p:[{s:"Il est arrivé [plutôt] que prévu.", fix:"plus tôt"},
     {s:"Elle se lève [plutôt] que d'habitude en été.", fix:"plus tôt"},
     {s:"Viens plus tôt, ou plutôt reste chez toi.", fix:null}]},

 {id:"quel-que", cat:"Homophones", n:3, t:"quel que ou quelque",
  r:"Devant le verbe être au subjonctif, on écrit <b>quel que</b> en deux mots, et « quel » s'accorde avec le sujet.",
  astuce:"quel que soit, quelle que soit, quels que soient.",
  p:[{s:"[Quelque] soit ton choix, je te soutiendrai.", fix:"Quel que"},
     {s:"[Quelques] soient les obstacles, il avance.", fix:"Quels que"},
     {s:"Quelles que soient tes raisons, préviens-moi.", fix:null}]},

 {id:"quoi-que", cat:"Homophones", n:3, t:"quoi que ou quoique",
  r:"<b>quoi que</b> en deux mots signifie « peu importe ce que ». <b>quoique</b> en un mot signifie « bien que ».",
  astuce:"Remplace par « bien que ». Si ça marche, un seul mot.",
  p:[{s:"[Quoique] tu fasses, fais-le sérieusement.", fix:"Quoi que"},
     {s:"Quoiqu'il soit fatigué, il continue.", fix:null}]},

 {id:"censé", cat:"Homophones", n:2, t:"censé ou sensé",
  r:"<b>censé</b> veut dire « supposé, réputé ». <b>sensé</b> veut dire « qui a du bon sens ».",
  astuce:"Remplace par « supposé » : si ça marche, c'est « censé ».",
  p:[{s:"Tu es [sensé] arriver à huit heures.", fix:"censé"},
     {s:"C'est un homme [censé] et raisonnable.", fix:"sensé"},
     {s:"Personne n'est censé ignorer la loi.", fix:null}]},

 {id:"dans-den", cat:"Homophones", n:3, t:"dans ou d'en",
  r:"<b>dans</b> est une préposition de lieu, <b>d'en</b> contient « de » et le pronom « en ».",
  astuce:"« d'en » est toujours suivi d'un verbe à l'infinitif.",
  p:[{s:"Il vient [dans] parler à son collègue.", fix:"d'en"},

 {id:"participe-présent", cat:"Conjugaison", n:3, t:"Participe présent ou adjectif verbal",
  r:"Le <b>participe présent</b> est invariable et marque l'action ; l'<b>adjectif verbal</b> décrit un état et s'accorde. Leur orthographe diffère parfois.",
  astuce:"Négligeant les consignes (action), mais des élèves négligents (état).",
  p:[{s:"Ce sont des élèves [négligeant] et bruyants.", fix:"négligents"},
     {s:"Négligeant les consignes, il a tout raté.", fix:null},
     {s:"Ce sont des arguments [convainquant].", fix:"convaincants"}]},

 {id:"aie-ait", cat:"Conjugaison", n:2, t:"Subjonctif du verbe avoir",
  r:"Au subjonctif : que j'<b>aie</b>, que tu <b>aies</b>, qu'il <b>ait</b>, que nous <b>ayons</b>.",
  astuce:"Après « que », le verbe avoir ne s'écrit jamais « ai » tout court.",
  p:[{s:"Il faut que j'[ai] plus de courage.", fix:"aie"},
     {s:"Il faut qu'il [a] terminé avant midi.", fix:"ait"},
     {s:"Il faut que tu aies confiance en toi.", fix:null}]},

 {id:"passé-simple", cat:"Conjugaison", n:3, t:"Passé simple ou imparfait",
  r:"À la première personne, le passé simple s'écrit <b>-ai</b> et l'imparfait <b>-ais</b>. Le passé simple raconte une action ponctuelle.",
  astuce:"« Souvent », « toujours », « chaque jour » appellent l'imparfait.",
  p:[{s:"Quand j'étais jeune, je [mangeai] souvent chez eux.", fix:"mangeais"},
     {s:"Ce jour-là, je fermai la porte et je partis.", fix:null}]},

 {id:"futur-ir", cat:"Conjugaison", n:3, t:"Futur des verbes en -ir",
  r:"Au futur, on ajoute la terminaison à l'infinitif entier : cour<b>ir</b> donne « courra » avec deux r, mais fini<b>r</b> donne « finira ».",
  astuce:"Courir, mourir et acquérir doublent le r au futur.",
  p:[{s:"Demain, il courra le marathon.", fix:null},
     {s:"Elle [finiras] son travail ce soir.", fix:"finira"},
     {s:"Nous [courons] plus vite demain qu'aujourd'hui.", fix:"courrons"}]},

 {id:"accord-verbe-sujet", cat:"Conjugaison", n:1, t:"Accord du verbe avec son sujet",
  r:"Le verbe s'accorde en personne et en nombre avec son sujet, même quand celui-ci est placé après.",
  astuce:"Pose la question « qui est-ce qui ? » avant le verbe.",
  p:[{s:"Les enfants [joue] dans le jardin.", fix:"jouent"},
     {s:"Ainsi [commence] les difficultés.", fix:"commencent"},
     {s:"Dans la cour jouent les enfants du quartier.", fix:null}]},

/* ─── ORTHOGRAPHE D'USAGE ─── */
 {id:"parmi-malgré", cat:"Orthographe d'usage", n:1, t:"parmi et malgré",
  r:"<b>parmi</b> et <b>malgré</b> ne prennent jamais de s.",
  astuce:"Le couple inverse prend un s : après et hormis.",
  p:[{s:"Il figure [parmis] les meilleurs de sa promotion.", fix:"parmi"},
     {s:"Il est sorti [malgrés] la pluie battante.", fix:"malgré"},
     {s:"Malgré tout, il est resté parmi nous.", fix:null}]},

 {id:"appeler", cat:"Orthographe d'usage", n:2, t:"appeler, jeter : quand doubler ?",
  r:"La consonne double <b>seulement</b> quand on entend le son [è] : j'appe<b>ll</b>e, mais nous appe<b>l</b>ons.",
  astuce:"Si tu entends « eu », une seule consonne.",
  p:[{s:"Il faut [appeller] le médecin sans tarder.", fix:"appeler"},
     {s:"Elle va [jetter] les vieux journaux.", fix:"jeter"},
     {s:"Nous appelons souvent, mais elle appelle rarement.", fix:null}]},

 {id:"ent-ant", cat:"Orthographe d'usage", n:2, t:"Adjectifs en -ent",
  r:"Certains adjectifs s'écrivent <b>-ent</b> et non -ant.",
  astuce:"Pense au nom de la famille : pertinence, cohérence, différence.",
  p:[{s:"C'est un argument tout à fait [pertinant].", fix:"pertinent"},
     {s:"Son discours n'est pas très [cohérant].", fix:"cohérent"},
     {s:"Son raisonnement est cohérent et pertinent.", fix:null}]},

 {id:"amment-emment", cat:"Orthographe d'usage", n:3, t:"-amment ou -emment",
  r:"L'adverbe se forme sur l'adjectif : <b>-ant</b> donne <b>-amment</b>, <b>-ent</b> donne <b>-emment</b>. Les deux se prononcent pareil.",
  astuce:"Prudent donne prudemment, courant donne couramment.",
  p:[{s:"Il conduit [prudamment] sur le verglas.", fix:"prudemment"},
     {s:"Elle parle [courrament] trois langues.", fix:"couramment"},
     {s:"Il parle couramment et répond prudemment.", fix:null}]},

 {id:"circonflexe", cat:"Orthographe d'usage", n:2, t:"L'accent circonflexe distinctif",
  r:"L'accent sépare deux mots identiques à l'oreille : <b>sûr</b> et <b>sur</b>, <b>dû</b> et <b>du</b>, <b>mûr</b> et <b>mur</b>.",
  astuce:"Remplace par « certain » : si ça marche, mets l'accent.",
  p:[{s:"Il viendra bien [sur] demain matin.", fix:"sûr"},
     {s:"Il a [du] partir plus tôt que prévu.", fix:"dû"},
     {s:"Bien sûr, le livre est sur la table.", fix:null}]},

 {id:"connexion", cat:"Orthographe d'usage", n:2, t:"connexion, réflexion, flexion",
  r:"Ces mots s'écrivent avec un <b>x</b>, jamais avec « ct ». L'anglais influence à tort l'orthographe.",
  astuce:"Pense à « flexible » : la famille garde le x.",
  p:[{s:"Ma [connection] internet est très lente.", fix:"connexion"},
     {s:"Après [reflexion], je préfère décliner.", fix:"réflexion"},
     {s:"La connexion demande un peu de réflexion.", fix:null}]},

 {id:"professionnel", cat:"Orthographe d'usage", n:2, t:"Les doubles consonnes fréquentes",
  r:"<b>professionnel</b> prend deux s et deux n, <b>développement</b> deux p et un l, <b>apercevoir</b> un seul p.",
  astuce:"Ces mots s'apprennent un par un : lis-les à voix haute en épelant.",
  p:[{s:"Il a un rendez-vous [profesionnel] demain.", fix:"professionnel"},
     {s:"Le [dévelopement] du projet a pris du retard.", fix:"développement"},
     {s:"Il l'a [apperçu] de loin dans la foule.", fix:"aperçu"},
     {s:"Le développement professionnel prend du temps.", fix:null}]},

 {id:"accueillir", cat:"Orthographe d'usage", n:2, t:"Le groupe -ueil",
  r:"Après c et g, on écrit <b>-ueil</b> et non -euil : accueil, cueillir, orgueil, recueil.",
  astuce:"Le u se glisse derrière le c pour garder le son [k].",
  p:[{s:"Ils vont nous [acceuillir] à la gare.", fix:"accueillir"},
     {s:"Il faut [ceuillir] les cerises maintenant.", fix:"cueillir"},
     {s:"L'accueil est ouvert, viens cueillir des fleurs.", fix:null}]},

 {id:"langage", cat:"Orthographe d'usage", n:2, t:"langage, dilemme, acompte",
  r:"Trois pièges classiques : <b>langage</b> sans u, <b>dilemme</b> avec deux m, <b>acompte</b> avec un seul c.",
  astuce:"Langage vient de langue, mais perd son u.",
  p:[{s:"Il apprend un nouveau [language] de programmation.", fix:"langage"},
     {s:"C'est un vrai [dilemne] pour lui.", fix:"dilemme"},
     {s:"Il a versé un [accompte] de deux cents euros.", fix:"acompte"},
     {s:"Le langage administratif pose un dilemme.", fix:null}]},

 {id:"week-end", cat:"Orthographe d'usage", n:2, t:"Les mots à trait d'union",
  r:"Certains mots empruntés ou composés gardent leur <b>trait d'union</b> : week-end, c'est-à-dire, vis-à-vis, après-midi.",
  astuce:"En cas de doute, le trait d'union est plus souvent requis qu'on ne croit.",
  p:[{s:"Il part en [weekend] à la montagne.", fix:"week-end"},
     {s:"Nous nous voyons cet [aprèsmidi].", fix:"après-midi"},
     {s:"Bon week-end, à cet après-midi.", fix:null}]},

 {id:"t-euphonique", cat:"Orthographe d'usage", n:3, t:"Le t euphonique",
  r:"Dans une question inversée, le <b>t</b> ajouté se place entre deux traits d'union, et le mot qui précède reste séparé.",
  astuce:"Y a-t-il, va-t-il, pense-t-elle : trois blocs bien séparés.",
  p:[{s:"[Y-a-t-il] quelqu'un dans la salle ?", fix:"Y a-t-il"},
     {s:"[Va-t'il] pleuvoir cet après-midi ?", fix:"Va-t-il"},
     {s:"Y a-t-il une raison ? Viendra-t-elle ?", fix:null}]},

 {id:"majuscule-nationalité", cat:"Orthographe d'usage", n:2, t:"Majuscule aux noms de peuples",
  r:"Le nom d'habitant prend une <b>majuscule</b>, l'adjectif et le nom de langue prennent une <b>minuscule</b>.",
  astuce:"Un Français parle français à des amis français.",
  p:[{s:"Il a rencontré un [français] à Rome.", fix:"Français"},
     {s:"La cuisine [Italienne] est réputée.", fix:"italienne"},
     {s:"Un Italien parle italien avec ses voisins.", fix:null}]},

 {id:"etc", cat:"Orthographe d'usage", n:2, t:"etc.",
  r:"<b>etc.</b> s'écrit avec un point abréviatif unique, jamais suivi de points de suspension, et n'est jamais répété.",
  astuce:"Un seul point suffit : etc.",
  p:[{s:"Des pommes, des poires, [etc...] à volonté.", fix:"etc."},
     {s:"Il faut du pain, du lait, etc.", fix:null}]},

 {id:"cent-mille", cat:"Orthographe d'usage", n:3, t:"mille et millier",
  r:"<b>mille</b> adjectif numéral est toujours invariable ; <b>millier</b>, <b>million</b> et <b>milliard</b> sont des noms et prennent un s.",
  astuce:"Deux mille personnes, mais deux milliers de personnes.",
  p:[{s:"Il y avait deux [milles] spectateurs.", fix:"mille"},
     {s:"Le stade a accueilli trois [million] de visiteurs.", fix:"millions"},
     {s:"Deux mille euros, soit deux milliers de billets.", fix:null}]},

 {id:"sceptique", cat:"Orthographe d'usage", n:3, t:"sceptique ou septique",
  r:"<b>sceptique</b> se dit de qui doute ; <b>septique</b> concerne les microbes, comme la fosse septique.",
  astuce:"Le scepticisme garde son sc, comme la science.",
  p:[{s:"Il reste [septique] devant cette promesse.", fix:"sceptique"},
     {s:"Il est sceptique, mais la fosse septique fonctionne.", fix:null}]},

 {id:"quelquefois", cat:"Orthographe d'usage", n:3, t:"quelquefois ou quelques fois",
  r:"<b>quelquefois</b> en un mot signifie « parfois » ; <b>quelques fois</b> en deux mots se compte.",
  astuce:"Remplace par « parfois » : si ça marche, un seul mot.",
  p:[{s:"Il vient [quelquesfois] le samedi matin.", fix:"quelquefois"},
     {s:"Je l'ai croisé quelques fois cette année.", fix:null}]},

 {id:"bientot", cat:"Orthographe d'usage", n:2, t:"bientôt ou bien tôt",
  r:"<b>bientôt</b> signifie « dans peu de temps » ; <b>bien tôt</b> signifie « très tôt ».",
  astuce:"Si tu peux ajouter « trop » devant « tôt », écris deux mots.",
  p:[{s:"Tu arrives [bientôt], il n'est que six heures.", fix:"bien tôt"},
     {s:"Tu arrives bien tôt, il n'est que six heures.", fix:null}]},

 {id:"hyphen-nombres", cat:"Orthographe d'usage", n:3, t:"Trait d'union dans les nombres",
  r:"Depuis 1990, tous les éléments d'un nombre composé se lient par des <b>traits d'union</b>.",
  astuce:"Vingt-et-un, trois-cent-quatre : on relie tout.",
  p:[{s:"Il a fêté ses [vingtetun] ans hier.", fix:"vingt-et-un"},
     {s:"Le compteur affiche trente-deux mille kilomètres.", fix:null}]},

/* ─── VOCABULAIRE ─── */
 {id:"conjoncture", cat:"Vocabulaire", n:3, t:"conjoncture ou conjecture",
  r:"La <b>conjoncture</b> est la situation d'ensemble à un moment donné. Une <b>conjecture</b> est une supposition non vérifiée.",
  astuce:"Conjoncture comme jonction : tout ce qui se rejoint.",
  p:[{s:"La [conjecture] économique reste difficile.", fix:"conjoncture"},
     {s:"Ce n'est qu'une conjecture, rien n'est prouvé.", fix:null}]},

 {id:"irruption", cat:"Vocabulaire", n:2, t:"irruption ou éruption",
  r:"Faire <b>irruption</b>, c'est entrer brusquement. Une <b>éruption</b> concerne un volcan ou la peau.",
  astuce:"Irruption comme intrusion : on entre.",

     {s:"Le volcan est entré en éruption cette nuit.", fix:null}]},

 {id:"voire", cat:"Vocabulaire", n:2, t:"voire ou voir",
  r:"<b>voire</b> signifie « et même ». <b>voir</b> est le verbe.",
  astuce:"Remplace par « et même » : si ça marche, un e à la fin.",
  p:[{s:"Le trajet dure deux heures, [voir] trois.", fix:"voire"},
     {s:"Il faudra voir, voire revenir demain.", fix:null}]},

 {id:"davantage", cat:"Vocabulaire", n:2, t:"davantage ou d'avantage",
  r:"<b>davantage</b> en un mot signifie « plus ». <b>d'avantage</b> en deux mots suppose un bénéfice.",
  astuce:"Remplace par « plus » : si ça marche, un seul mot.",
  p:[{s:"Il faudrait travailler [d'avantage] cette année.", fix:"davantage"},
     {s:"Il n'y voit pas d'avantage à déménager.", fix:null}]},

 {id:"savoir-gré", cat:"Vocabulaire", n:3, t:"savoir gré",
  r:"L'expression est <b>savoir gré</b>, jamais « être gré ».",
  astuce:"Je vous saurais gré, je lui sais gré.",
  p:[{s:"Je vous [serais] gré de me répondre vite.", fix:"saurais"},
     {s:"Je vous sais gré de votre aide précieuse.", fix:null}]},

 {id:"amener", cat:"Vocabulaire", n:2, t:"amener ou apporter",
  r:"On <b>amène</b> une personne ou un animal, on <b>apporte</b> une chose.",
  astuce:"Mener conduit quelqu'un, porter tient un objet.",

     {s:"Il a amené son frère et apporté le dessert.", fix:null}]},

 {id:"emmener", cat:"Vocabulaire", n:2, t:"emmener ou emporter",
  r:"On <b>emmène</b> quelqu'un avec soi, on <b>emporte</b> un objet.",
  astuce:"Même logique que amener et apporter.",
  p:[{s:"N'oublie pas d'[emmener] ton parapluie.", fix:"emporter"},
     {s:"Elle emmène sa fille et emporte son sac.", fix:null}]},

 {id:"éminent", cat:"Vocabulaire", n:3, t:"éminent ou imminent",
  r:"<b>éminent</b> signifie remarquable ; <b>imminent</b> signifie sur le point d'arriver.",
  astuce:"Imminent comme immédiat : c'est une question de temps.",
  p:[{s:"Le départ est [éminent], dépêche-toi.", fix:"imminent"},
     {s:"C'est un [imminent] professeur de droit.", fix:"éminent"},
     {s:"Un éminent chercheur annonce une découverte imminente.", fix:null}]},

 {id:"collision", cat:"Vocabulaire", n:3, t:"collision ou collusion",
  r:"Une <b>collision</b> est un choc ; une <b>collusion</b> est une entente secrète.",
  astuce:"Collision comme collide : deux choses se percutent.",
  p:[{s:"Les deux voitures sont entrées en [collusion].", fix:"collision"},
     {s:"On soupçonne une collusion entre les deux groupes.", fix:null}]},

 {id:"effraction", cat:"Vocabulaire", n:3, t:"effraction ou infraction",
  r:"Une <b>effraction</b> est un bris de serrure ; une <b>infraction</b> est une violation de la loi.",
  astuce:"Effraction comme fracture : quelque chose est cassé.",
  p:[{s:"Ils sont entrés par [infraction] dans le garage.", fix:"effraction"},
     {s:"Cette infraction lui a valu une amende.", fix:null}]},

 {id:"original", cat:"Vocabulaire", n:3, t:"original ou originel",
  r:"<b>original</b> signifie inédit ou de première main ; <b>originel</b> signifie qui remonte à l'origine.",
  astuce:"Le péché originel, mais une idée originale.",
  p:[{s:"Le texte [originel] de ce contrat est perdu.", fix:"original"},
     {s:"Le sens originel du mot s'est perdu.", fix:null}]},

 {id:"littéral", cat:"Vocabulaire", n:2, t:"littéral ou littoral",
  r:"<b>littéral</b> concerne la lettre, le texte ; <b>littoral</b> désigne le bord de mer.",
  astuce:"Littoral comme le rivage, littéral comme la littérature.",
  p:[{s:"Il en a fait une traduction [littorale].", fix:"littérale"},
     {s:"Le littoral breton est très découpé.", fix:null}]},

 {id:"tache", cat:"Vocabulaire", n:2, t:"tache ou tâche",
  r:"Une <b>tache</b> est une salissure ; une <b>tâche</b> est un travail à faire.",
  astuce:"L'accent est la charge de travail qui pèse sur le a.",
  p:[{s:"Il a une [tache] difficile à accomplir.", fix:"tâche"},
     {s:"Il y a une [tâche] de café sur ta chemise.", fix:"tache"},
     {s:"Nettoyer cette tache est une vraie tâche.", fix:null}]},

 {id:"cession", cat:"Vocabulaire", n:3, t:"cession ou session",
  r:"Une <b>cession</b> est la vente d'un bien ; une <b>session</b> est une période de travail.",
  astuce:"Céder donne cession, s'asseoir donne session.",
  p:[{s:"La [cession] de rattrapage aura lieu en juin.", fix:"session"},
     {s:"La cession des parts a été signée hier.", fix:null}]},

 {id:"dessein", cat:"Vocabulaire", n:3, t:"dessein ou dessin",
  r:"Un <b>dessein</b> est une intention ; un <b>dessin</b> est une image.",
  astuce:"À dessein signifie exprès.",
  p:[{s:"Il l'a fait à [dessin], pour provoquer.", fix:"dessein"},
     {s:"Son dessin illustre parfaitement son dessein.", fix:null}]},

 {id:"balade", cat:"Vocabulaire", n:2, t:"balade ou ballade",
  r:"Une <b>balade</b> est une promenade ; une <b>ballade</b> est un poème ou une chanson.",
  astuce:"La ballade a deux l comme la mélodie a deux notes tenues.",
  p:[{s:"Ils sont partis en [ballade] dans la forêt.", fix:"balade"},
     {s:"Cette ballade médiévale accompagne bien la balade.", fix:null}]},

 {id:"acception", cat:"Vocabulaire", n:3, t:"acception ou acceptation",
  r:"Une <b>acception</b> est un sens de mot ; l'<b>acceptation</b> est le fait d'accepter.",
  astuce:"Le dictionnaire donne les acceptions d'un terme.",
  p:[{s:"Ce mot a plusieurs [acceptations] en droit.", fix:"acceptions"},
     {s:"Son acceptation du poste a surpris tout le monde.", fix:null}]},

 {id:"compréhensif", cat:"Vocabulaire", n:2, t:"compréhensif ou compréhensible",
  r:"<b>compréhensif</b> se dit d'une personne indulgente ; <b>compréhensible</b> se dit de ce qu'on peut comprendre.",
  astuce:"Un chef compréhensif donne des consignes compréhensibles.",
  p:[{s:"Son explication n'était pas très [compréhensive].", fix:"compréhensible"},
     {s:"Un directeur compréhensif écoute ses équipes.", fix:null}]},

 {id:"perpétrer", cat:"Vocabulaire", n:3, t:"perpétrer ou perpétuer",
  r:"<b>perpétrer</b>, c'est commettre un acte ; <b>perpétuer</b>, c'est faire durer.",
  astuce:"Perpétuer comme perpétuel : cela continue.",
  p:[{s:"Ils veulent [perpétrer] la tradition familiale.", fix:"perpétuer"},
     {s:"Le crime a été perpétré pendant la nuit.", fix:null}]},

 {id:"recouvrer", cat:"Vocabulaire", n:3, t:"recouvrer ou recouvrir",
  r:"<b>recouvrer</b>, c'est retrouver ou encaisser ; <b>recouvrir</b>, c'est couvrir entièrement.",
  astuce:"Recouvrer la vue, recouvrir un mur.",
  p:[{s:"Il a enfin [recouvert] la santé.", fix:"recouvré"},
     {s:"La neige a recouvert tout le jardin.", fix:null}]},

 {id:"inclinaison", cat:"Vocabulaire", n:3, t:"inclinaison ou inclination",
  r:"L'<b>inclinaison</b> est un angle ; une <b>inclination</b> est un penchant.",

  p:[{s:"Il a une nette [inclinaison] pour la musique.", fix:"inclination"},

 {id:"notable", cat:"Vocabulaire", n:3, t:"notable ou notoire",
  r:"<b>notable</b> signifie important, digne d'être noté ; <b>notoire</b> signifie connu de tous.",
  astuce:"Un fait notoire est public, un progrès notable est net.",
  p:[{s:"C'est un menteur [notable], tout le monde le sait.", fix:"notoire"},
     {s:"On observe une amélioration notable des résultats.", fix:null}]},

 {id:"pallier", cat:"Vocabulaire", n:3, t:"pallier",

  p:[{s:"Il faut pallier [à] ce manque de personnel.", fix:"à supprimer"},
     {s:"Cette mesure pallie le manque de moyens.", fix:null}]},

 {id:"se-rappeler", cat:"Vocabulaire", n:3, t:"se rappeler ou se souvenir",
  r:"On <b>se rappelle</b> quelque chose, mais on <b>se souvient de</b> quelque chose.",
  astuce:"Se rappeler se construit directement, sans « de ».",
  p:[{s:"Je me rappelle [de] cette journée d'été.", fix:"à supprimer"},
     {s:"Je me souviens de ce jour et je me le rappelle bien.", fix:null}]},

 {id:"attention-intention", cat:"Vocabulaire", n:3, t:"à l'attention ou à l'intention",

     {s:"Note à l'attention du service comptable.", fix:null}]},

 {id:"en-termes", cat:"Vocabulaire", n:3, t:"en termes de",

  p:[{s:"En [terme] de budget, tout est correct.", fix:"termes"},
     {s:"En termes de qualité, rien à redire.", fix:null}]},

 {id:"espèce", cat:"Vocabulaire", n:2, t:"une espèce de",
  r:"<b>espèce</b> est toujours féminin, quel que soit le mot qui suit.",

  p:[{s:"Les [travails] de rénovation sont terminés.", fix:"travaux"},
     {s:"Les [vitrails] de la cathédrale sont anciens.", fix:"vitraux"},
     {s:"Les détails des travaux ont été discutés.", fix:null}]},

 {id:"leur-possessif", cat:"Accords", n:2, t:"leur devant un nom",
  r:"Déterminant, <b>leur</b> s'accorde avec le nom qu'il précède, pas avec les possesseurs.",
  astuce:"S'ils ont chacun un seul chapeau, on écrit « leur chapeau ».",
  p:[{s:"Ils ont mis [leurs] chapeau avant de sortir.", fix:"leur"},
     {s:"Elles ont rangé [leur] affaires dans le placard.", fix:"leurs"},
     {s:"Ils ont pris leur temps et rangé leurs outils.", fix:null}]},

 {id:"nombreux-sujet", cat:"Accords", n:2, t:"Accord avec un titre ou un nom propre pluriel",
  r:"Le verbe s'accorde avec le sujet réel : un titre d'œuvre au pluriel commande le pluriel s'il désigne plusieurs éléments.",
  astuce:"Les Misérables sont un roman célèbre : le pluriel du titre l'emporte.",
  p:[{s:"Les Trois Mousquetaires [est] un roman d'aventures.", fix:"sont"},
     {s:"Les Misérables ont été adaptés au cinéma.", fix:null}]},

/* ─── CONJUGAISON AVANCÉE ─── */
 {id:"acheter-geler", cat:"Conjugaison", n:2, t:"acheter, geler : accent grave",
  r:"Contrairement à appeler et jeter, ces verbes ne doublent pas la consonne : ils prennent un <b>accent grave</b>.",
  astuce:"J'achète, il gèle, elle pèle, nous achetons.",
  p:[{s:"Il [achette] son pain à la boulangerie.", fix:"achète"},
     {s:"L'eau [gelle] déjà dans les tuyaux.", fix:"gèle"},
     {s:"Il achète du sel quand il gèle.", fix:null}]},

 {id:"verbes-eer", cat:"Conjugaison", n:3, t:"Verbes en -éer",
  r:"Les verbes en <b>-éer</b> gardent leur é au participe passé, qui se termine donc par <b>-éé</b> au féminin.",
  astuce:"Créer donne créé, créée, créés, créées.",
  p:[{s:"Il a [crée] une société l'an dernier.", fix:"créé"},
     {s:"L'association qu'il a créée fonctionne bien.", fix:null}]},

 {id:"faire-dire", cat:"Conjugaison", n:1, t:"vous faites, vous dites",
  r:"Trois verbes seulement se terminent par <b>-tes</b> à la deuxième personne du pluriel : être, faire et dire.",
  astuce:"Vous êtes, vous faites, vous dites : le reste prend -ez.",
  p:[{s:"Vous [faisez] beaucoup trop de bruit.", fix:"faites"},
     {s:"Vous [disez] toujours la même chose.", fix:"dites"},
     {s:"Vous faites et vous dites ce que vous voulez.", fix:null}]},

 {id:"predire", cat:"Conjugaison", n:3, t:"vous prédisez, vous contredisez",
  r:"Seul <b>dire</b> donne « vous dites ». Ses composés font <b>-disez</b> : prédisez, contredisez, interdisez.",
  astuce:"L'exception ne se transmet pas aux dérivés, sauf « redites ».",
  p:[{s:"Vous [prédites] toujours le pire.", fix:"prédisez"},
     {s:"Vous interdisez ce que vous dites autoriser.", fix:null}]},

 {id:"resoudre", cat:"Conjugaison", n:3, t:"résoudre, absoudre",
  r:"À la troisième personne du singulier, ces verbes se terminent par <b>-out</b> : il résout, il absout.",
  astuce:"Le d disparaît, le t apparaît.",
  p:[{s:"Il [résoud] le problème en une minute.", fix:"résout"},
     {s:"Il résout tout, mais il absout rarement.", fix:null}]},

 {id:"battre-rompre", cat:"Conjugaison", n:2, t:"battre et rompre",
  r:"<b>battre</b> perd un t au singulier (il bat) ; <b>rompre</b> garde son p et prend un t (il rompt).",
  astuce:"Il bat les cartes, il rompt le silence.",
  p:[{s:"Il [bas] les cartes avant de distribuer.", fix:"bat"},
     {s:"Il [romp] le silence d'un mot.", fix:"rompt"},
     {s:"Il bat les cartes et rompt le silence.", fix:null}]},

 {id:"verbes-dre", cat:"Conjugaison", n:2, t:"Verbes en -dre",
  r:"Les verbes en <b>-dre</b> gardent leur d à la troisième personne du singulier : il répond, il perd, il coud, il prend.",
  astuce:"Pas de t ajouté quand le d est déjà là.",
  p:[{s:"Il [répon] toujours à côté de la question.", fix:"répond"},
     {s:"Elle [couds] un bouton à sa veste.", fix:"coud"},
     {s:"Il perd son temps et coud un bouton.", fix:null}]},

 {id:"futurs-irreguliers", cat:"Conjugaison", n:2, t:"Futurs irréguliers",
  r:"Certains verbes ont un futur imprévisible : il <b>verra</b>, il <b>fera</b>, il <b>enverra</b>, il <b>saura</b>, il <b>viendra</b>.",
  astuce:"Envoyer fait enverra, comme voir fait verra : deux r.",
  p:[{s:"Demain, il [voira] le médecin.", fix:"verra"},
     {s:"Elle t'[envoiera] le document ce soir.", fix:"enverra"},
     {s:"Il verra, il fera et il enverra tout demain.", fix:null}]},

 {id:"acquerir", cat:"Conjugaison", n:3, t:"acquérir",
  r:"Le participe passé est <b>acquis</b>, avec c et q, comme dans « acquisition ».",
  astuce:"Il acquiert au présent, il a acquis au passé.",
  p:[{s:"Il a [aquis] beaucoup d'expérience.", fix:"acquis"},
     {s:"Il acquiert vite et n'oublie rien.", fix:null}]},

 {id:"asseoir", cat:"Conjugaison", n:3, t:"s'asseoir",
  r:"Deux formes coexistent : il <b>s'assied</b> et il <b>s'assoit</b>. Ni « s'assois » ni « s'assoie » à la troisième personne.",
  astuce:"Je m'assois, tu t'assois, il s'assoit : le s ne va qu'aux deux premières personnes.",
  p:[{s:"Il s'[assois] sur le banc du parc.", fix:"assoit"},
     {s:"Il s'assied près de la fenêtre.", fix:null}]},

 {id:"subj-pouvoir", cat:"Conjugaison", n:2, t:"Subjonctif de pouvoir et savoir",
  r:"Au subjonctif : que je <b>puisse</b>, que je <b>sache</b>, que je <b>fasse</b>, que j'<b>aille</b>.",
  astuce:"Ces formes ne ressemblent pas au présent : elles s'apprennent à part.",
  p:[{s:"Bien que je [peux] t'aider, je préfère attendre.", fix:"puisse"},
     {s:"Il faut que tu [vas] à la mairie.", fix:"ailles"},
     {s:"Bien que je sache tout, je préfère me taire.", fix:null}]},

 {id:"esperer-que", cat:"Conjugaison", n:3, t:"espérer que + indicatif",
  r:"À la forme affirmative, <b>espérer que</b> est suivi de l'indicatif, pas du subjonctif.",
  astuce:"J'espère qu'il viendra, mais je souhaite qu'il vienne.",
  p:[{s:"J'espère qu'il [vienne] demain matin.", fix:"viendra"},
     {s:"J'espère qu'il viendra et je souhaite qu'il reste.", fix:null}]},

 {id:"passé-simple-pluriel", cat:"Conjugaison", n:3, t:"Passé simple à la troisième personne du pluriel",
  r:"Au passé simple, les verbes du deuxième groupe font <b>-irent</b> : ils finirent, ils partirent.",
  astuce:"L'imparfait donne « finissaient », le passé simple « finirent ».",
  p:[{s:"Ils [finissèrent] leur travail très tard.", fix:"finirent"},
     {s:"Ils finirent tard et rentrèrent à pied.", fix:null}]},

 {id:"auxiliaire", cat:"Conjugaison", n:2, t:"Auxiliaire être ou avoir",
  r:"Certains verbes changent d'auxiliaire selon le sens : <b>être</b> quand ils sont intransitifs, <b>avoir</b> quand ils ont un complément d'objet.",
  astuce:"Il est monté à l'étage, mais il a monté la valise.",
  p:[{s:"Il [a] tombé dans l'escalier hier soir.", fix:"est"},
     {s:"Elle [est] descendu les poubelles.", fix:"a"},
     {s:"Il est tombé après avoir descendu la valise.", fix:null}]},

 {id:"hair", cat:"Conjugaison", n:3, t:"haïr",
  r:"<b>haïr</b> perd son tréma aux trois personnes du singulier du présent : je hais, tu hais, il hait ; mais nous haïssons.",
  astuce:"Le tréma revient dès que la prononciation sépare les deux voyelles.",
  p:[{s:"Nous [haissons] le mensonge par-dessus tout.", fix:"haïssons"},
     {s:"Je hais le mensonge et nous haïssons l'hypocrisie.", fix:null}]},

 {id:"fatigant", cat:"Conjugaison", n:3, t:"fatigant ou fatiguant",
  r:"L'<b>adjectif</b> perd le u : fatigant, intrigant, navigant. Le <b>participe présent</b> le garde : fatiguant, intriguant.",
  astuce:"Si tu peux mettre au féminin, c'est l'adjectif : une journée fatigante.",
  p:[{s:"C'est un travail vraiment [fatiguant].", fix:"fatigant"},
     {s:"En fatiguant ses jambes, il est devenu fatigant.", fix:null}]},

 {id:"ouvrir-passé", cat:"Conjugaison", n:3, t:"Passé simple des verbes en -rir",
  r:"Ouvrir, offrir et couvrir font leur passé simple en <b>-it</b> : il ouvrit, il offrit, il couvrit.",
  astuce:"Leur participe passé, lui, se termine par -ert : ouvert, offert.",
  p:[{s:"Il [ouvra] la porte sans faire de bruit.", fix:"ouvrit"},
     {s:"Il ouvrit la porte et offrit son bras.", fix:null}]},

 {id:"pronominaux-etre", cat:"Conjugaison", n:2, t:"Auxiliaire des verbes pronominaux",
  r:"Aux temps composés, un verbe pronominal se conjugue <b>toujours</b> avec l'auxiliaire être, jamais avoir.",
  astuce:"Elle s'est lavée, ils se sont vus : jamais « elle s'a ».",
  p:[{s:"Elle s'[a] lavé les mains avant de manger.", fix:"est"},
     {s:"Ils se sont parlé toute la soirée.", fix:null},
     {s:"Nous nous [avons] trompés de route.", fix:"sommes"}]},

/* ─── ORTHOGRAPHE D'USAGE : ACCENTS ET CONSONNES ─── */
 {id:"accent-grave", cat:"Orthographe d'usage", n:2, t:"è devant une syllabe muette",
  r:"Le e prend un <b>accent grave</b> quand la syllabe suivante contient un e muet : règlement, collège, sévère.",
  astuce:"Compare règle et régler : l'accent suit la prononciation.",
  p:[{s:"Le [réglement] intérieur a été affiché.", fix:"règlement"},
     {s:"Il entre au [collége] en septembre.", fix:"collège"},
     {s:"Le règlement du collège est très strict.", fix:null}]},

 {id:"cedille", cat:"Orthographe d'usage", n:1, t:"La cédille",
  r:"La cédille s'ajoute au c devant <b>a</b>, <b>o</b> et <b>u</b> pour garder le son [s] : reçu, façon, aperçu.",
  astuce:"Devant e et i, la cédille est inutile : ceci, cinéma.",
  p:[{s:"Il a [recu] une lettre recommandée.", fix:"reçu"},
     {s:"Il a agi de cette [facon] toute sa vie.", fix:"façon"},
     {s:"Il a reçu une leçon de français.", fix:null}]},

 {id:"h-aspire", cat:"Orthographe d'usage", n:3, t:"h muet ou h aspiré",
  r:"Devant un <b>h aspiré</b>, pas d'élision ni de liaison : le hasard, le hall, la hauteur. Devant un h muet, l'élision est obligatoire : l'hôtel, l'habitude.",
  astuce:"Si tu dis « le » naturellement, le h est aspiré.",
  p:[{s:"Je l'ai croisé par [l'hasard] dans la rue.", fix:"le hasard"},
     {s:"Il attend dans le hall de l'hôtel.", fix:null}]},

 {id:"elision", cat:"Orthographe d'usage", n:1, t:"L'élision",
  r:"Devant une voyelle ou un h muet, <b>le</b>, <b>la</b>, <b>de</b>, <b>ne</b> et <b>que</b> perdent leur voyelle.",
  astuce:"On n'écrit jamais « le arbre » ni « de eau ».",
  p:[{s:"Il attend [le] arrivée du train de Lyon.", fix:"l'"},
     {s:"Il attend l'arrivée de l'avion de Rome.", fix:null}]},

 {id:"aujourdhui", cat:"Orthographe d'usage", n:1, t:"aujourd'hui",
  r:"<b>aujourd'hui</b> s'écrit en un seul mot avec une apostrophe. « Au jour d'aujourd'hui » est un pléonasme à éviter.",
  astuce:"Le mot contient déjà « au jour de ».",
  p:[{s:"Nous sommes [aujourdhui] le premier mars.", fix:"aujourd'hui"},
     {s:"Aujourd'hui, tout est prêt pour la fête.", fix:null}]},

 {id:"adresse", cat:"Orthographe d'usage", n:2, t:"adresse, apercevoir, agrandir",
  r:"Ces mots ne prennent <b>qu'une seule consonne</b> après le a initial, contrairement à ce que l'anglais suggère.",
  astuce:"Adresse a un d, comme adresser.",
  p:[{s:"Il a changé d'[addresse] le mois dernier.", fix:"adresse"},
     {s:"Son adresse est correcte, il faut la vérifier.", fix:null}]},

 {id:"nourrir", cat:"Orthographe d'usage", n:2, t:"courir, mourir, nourrir",
  r:"<b>courir</b> et <b>mourir</b> ne prennent qu'un r ; <b>nourrir</b> et <b>pourrir</b> en prennent deux.",
  astuce:"On meurt une fois avec un r, on se nourrit tous les jours avec deux.",
  p:[{s:"Il faut [nourir] le chat avant de partir.", fix:"nourrir"},
     {s:"Il va [courrir] son premier marathon.", fix:"courir"},
     {s:"Il va courir puis nourrir le chien.", fix:null}]},

 {id:"souffrir", cat:"Orthographe d'usage", n:2, t:"Les doubles f",
  r:"<b>souffrir</b>, <b>offrir</b>, <b>siffler</b> et <b>suffire</b> prennent deux f.",
  astuce:"Le préfixe latin sub- s'assimile au f suivant : suf-frir.",
  p:[{s:"Il fait [soufrir] tout le monde autour de lui.", fix:"souffrir"},
     {s:"Cela ne [sufit] pas à le convaincre.", fix:"suffit"},
     {s:"Souffrir ne suffit pas à excuser.", fix:null}]},

 {id:"honneur", cat:"Orthographe d'usage", n:3, t:"honneur mais honorer",
  r:"<b>honneur</b> prend deux n, mais <b>honorer</b>, <b>honorable</b> et <b>honoraire</b> n'en prennent qu'un.",
  astuce:"La famille du mot ne garde pas toujours la double consonne.",
  p:[{s:"Il faut l'[honnorer] pour son courage.", fix:"honorer"},
     {s:"C'est un honneur de l'honorer ce soir.", fix:null}]},

 {id:"national", cat:"Orthographe d'usage", n:2, t:"national mais rationnel",
  r:"<b>national</b> et <b>rational</b> s'écrivent avec un seul n ; <b>rationnel</b>, <b>traditionnel</b> et <b>professionnel</b> en prennent deux.",
  astuce:"Les adjectifs en -onnel prennent deux n, ceux en -onal un seul.",
  p:[{s:"C'est un projet [nationnal] d'envergure.", fix:"national"},
     {s:"Son choix n'est pas très [rationel].", fix:"rationnel"},
     {s:"Un plan national fondé sur un choix rationnel.", fix:null}]},

 {id:"occasion", cat:"Orthographe d'usage", n:2, t:"occasion, occuper, occurrence",
  r:"Les mots formés sur le préfixe <b>ob-</b> doublent le c : occasion, occuper, occurrence.",
  astuce:"Ob- devant c donne oc-c.",
  p:[{s:"C'est une [ocasion] à ne pas manquer.", fix:"occasion"},
     {s:"Cette occasion l'occupe depuis des jours.", fix:null}]},

 {id:"chariot", cat:"Orthographe d'usage", n:3, t:"chariot et charrette",
  r:"<b>chariot</b> ne prend qu'un r, alors que <b>charrette</b>, <b>charrue</b> et <b>charrier</b> en prennent deux.",
  astuce:"C'est la seule exception de la famille : le chariot est solitaire.",
  p:[{s:"Il pousse le [charriot] dans les allées.", fix:"chariot"},
     {s:"Le chariot suit la charrette sur le chemin.", fix:null}]},

 {id:"combatif", cat:"Orthographe d'usage", n:3, t:"combatif mais combattre",
  r:"<b>combattre</b> et <b>combattant</b> prennent deux t, mais <b>combatif</b> et <b>combativité</b> n'en prennent qu'un.",
  astuce:"Même piège que honneur et honorer.",
  p:[{s:"Il a gardé un esprit [combattif].", fix:"combatif"},
     {s:"Ce combattant reste combatif malgré tout.", fix:null}]},

 {id:"imbecile", cat:"Orthographe d'usage", n:3, t:"imbécile et atterrir",
  r:"<b>imbécile</b> ne prend qu'un l, mais <b>imbécillité</b> en prend deux. <b>atterrir</b> prend deux t et deux r.",
  astuce:"Ces irrégularités n'ont pas de logique : il faut les mémoriser.",
  p:[{s:"Ne fais pas l'[imbécille] devant les invités.", fix:"imbécile"},
     {s:"L'avion va [aterrir] dans dix minutes.", fix:"atterrir"},
     {s:"Cet imbécile a regardé l'avion atterrir.", fix:null}]},

 {id:"emment", cat:"Orthographe d'usage", n:3, t:"Les adverbes en -emment",
  r:"Les adjectifs en <b>-ent</b> donnent des adverbes en <b>-emment</b> : évident donne évidemment, apparent donne apparemment.",
  astuce:"Remonte à l'adjectif : sa terminaison décide de celle de l'adverbe.",
  p:[{s:"[Apparament], il a changé d'avis.", fix:"Apparemment"},
     {s:"Il a [évidament] raison sur ce point.", fix:"évidemment"},
     {s:"Apparemment, il a évidemment tout compris.", fix:null}]},

 {id:"decision", cat:"Orthographe d'usage", n:2, t:"-sion, -ssion ou -tion",
  r:"Le son [sj] s'écrit <b>-sion</b> après une consonne ou une voyelle simple, et <b>-ssion</b> entre deux voyelles quand le son est [s].",
  astuce:"Remonte au verbe : décider donne décision, discuter donne discussion.",
  p:[{s:"C'est une [décition] difficile à prendre.", fix:"décision"},
     {s:"La [discution] a duré deux heures.", fix:"discussion"},
     {s:"La décision est née d'une longue discussion.", fix:null}]},

 {id:"orthographe", cat:"Orthographe d'usage", n:2, t:"Le groupe ph",
  r:"Les mots d'origine grecque s'écrivent avec <b>ph</b> : orthographe, photographie, philosophie, pharmacie.",
  astuce:"Si le mot vient du grec, le son [f] s'écrit ph.",
  p:[{s:"L'[ortographe] française est difficile.", fix:"orthographe"},
     {s:"L'orthographe et la photographie l'intéressent.", fix:null}]},

 {id:"gymnastique", cat:"Orthographe d'usage", n:2, t:"Le y d'origine grecque",
  r:"Les mots venus du grec conservent le <b>y</b> : rythme, gymnastique, symbole, système.",
  astuce:"Même origine que le ph : le grec laisse ses traces.",
  p:[{s:"Il fait de la [gimnastique] tous les matins.", fix:"gymnastique"},
     {s:"Le [ritme] de la musique est entraînant.", fix:"rythme"},
     {s:"Le rythme de la gymnastique lui convient.", fix:null}]},

 {id:"consequence", cat:"Orthographe d'usage", n:2, t:"-ance ou -ence",
  r:"Les noms formés sur un adjectif en <b>-ent</b> prennent <b>-ence</b> : conséquent donne conséquence, absent donne absence.",
  astuce:"Ceux formés sur -ant prennent -ance : vaillant donne vaillance.",
  p:[{s:"La [conséquance] de son retard est lourde.", fix:"conséquence"},
     {s:"Son [absance] a été remarquée.", fix:"absence"},
     {s:"La conséquence de son absence est claire.", fix:null}]},

 {id:"monsieur-abrev", cat:"Orthographe d'usage", n:3, t:"Abréviations de civilité",
  r:"On abrège <b>M.</b> pour monsieur, <b>MM.</b> pour messieurs, <b>Mme</b> et <b>Mmes</b> sans point.",
  astuce:"« Mr » est l'abréviation anglaise, pas la française.",
  p:[{s:"[Mr] Dupont vous attend dans son bureau.", fix:"M."},
     {s:"M. et Mme Dupont sont déjà arrivés.", fix:null}]},

 {id:"jours-mois", cat:"Orthographe d'usage", n:1, t:"Jours et mois en minuscule",
  r:"Les noms de jours et de mois s'écrivent avec une <b>minuscule</b> en français.",
  astuce:"Seul l'anglais met des majuscules à Monday et January.",
  p:[{s:"Nous sommes [Lundi] matin, il pleut.", fix:"lundi"},
     {s:"Il part en vacances en [Août].", fix:"août"},
     {s:"Le premier lundi de janvier, tout rouvre.", fix:null}]},

 {id:"trema", cat:"Orthographe d'usage", n:3, t:"Le tréma",
  r:"Le tréma indique qu'une voyelle se prononce séparément : maïs, naïf, aiguë, Noël.",
  astuce:"Sans tréma, « mais » et « maïs » se confondraient.",
  p:[{s:"Il a semé du [mais] dans le champ.", fix:"maïs"},
     {s:"Il est un peu [naif] pour son âge.", fix:"naïf"},
     {s:"Ce naïf a récolté du maïs à Noël.", fix:null}]},

/* ─── VOCABULAIRE : PARONYMES ─── */
 {id:"acquit", cat:"Vocabulaire", n:3, t:"acquit ou acquis",
  r:"Un <b>acquit</b> est une quittance, d'où « par acquit de conscience ». Un <b>acquis</b> est ce que l'on a acquis.",
  astuce:"On s'acquitte d'une dette, on acquiert un savoir.",
  p:[{s:"Il a vérifié par [acquis] de conscience.", fix:"acquit"},
     {s:"Ses acquis professionnels sont solides.", fix:null}]},

 {id:"consumer", cat:"Vocabulaire", n:3, t:"consommer ou consumer",
  r:"<b>consommer</b>, c'est utiliser ou manger ; <b>consumer</b>, c'est détruire par le feu.",
  astuce:"Le feu consume, le client consomme.",
  p:[{s:"L'incendie a [consommé] toute la grange.", fix:"consumé"},
     {s:"Il consomme peu d'électricité en hiver.", fix:null}]},

 {id:"decennie", cat:"Vocabulaire", n:3, t:"décade ou décennie",
  r:"Une <b>décade</b> dure dix jours ; une <b>décennie</b> dure dix ans.",
  astuce:"Décennie contient « an » comme dans annuel.",
  p:[{s:"Il a vécu là-bas pendant une [décade].", fix:"décennie"},
     {s:"Une décade compte dix jours seulement.", fix:null}]},

 {id:"detonant", cat:"Vocabulaire", n:3, t:"détonant ou détonnant",
  r:"<b>détonant</b> vient de détoner (exploser) ; <b>détonnant</b> vient de détonner (sortir du ton).",
  astuce:"Deux n pour le ton, un seul pour l'explosion.",
  p:[{s:"C'est un mélange [détonnant] de saveurs.", fix:"détonant"},
     {s:"Sa voix détonne au milieu du chœur.", fix:null}]},

 {id:"emigrer", cat:"Vocabulaire", n:3, t:"émigrer ou immigrer",
  r:"On <b>émigre</b> quand on quitte son pays, on <b>immigre</b> quand on entre dans un autre.",
  astuce:"É comme sortir, im comme entrer.",
  p:[{s:"Il a quitté son pays pour [immigrer] vers l'Europe.", fix:"émigrer"},
     {s:"Les personnes qui immigrent en France doivent s'inscrire.", fix:null}]},

/* ═══════════ ÉTAT ET SAUVEGARDE ═══════════ */
const CLE = "la-regle:progression";
const INTERVALLES = [3, 12, 35, 90, 220, 500];   // en nombre de questions répondues
const TAILLES = [10, 20, 35];
const TAILLE_TEST = 25;
const NEUVES_MAX = 6;                            // règles inédites par série

let etat = null, sauvegardeOK = true, filtre = null;

function etatNeuf(){
  return {v:2, compteur:0, testFait:false, taille:20, regles:{}, dictees:{}, sessions:[]};
}
function fiche(id){
  if(!etat.regles[id]) etat.regles[id] = {b:0, du:0, vus:0, ok:0, neuf:true, derniere:-1};
  return etat.regles[id];
}
async function charger(){
  try{
    const r = await window.storage.get(CLE);
    etat = r && r.value ? JSON.parse(r.value) : etatNeuf();
  }catch(e){ etat = etatNeuf(); }
  if(!etat.taille || !TAILLES.includes(etat.taille)) etat.taille = 20;
  if(!etat.dictees) etat.dictees = {};
  if(!etat.sessions) etat.sessions = [];
  REGLES.forEach(r=>fiche(r.id));
}
async function sauver(){
  try{ await window.storage.set(CLE, JSON.stringify(etat)); }
  catch(e){ sauvegardeOK = false; }
}

/* ═══════════ OUTILS ═══════════ */
const scene = document.getElementById('scene');
const fil = document.getElementById('fil');
const accroche = document.getElementById('accroche');
const CATS = [...new Set(REGLES.map(r=>r.cat))];

function melanger(t){const c=t.slice();for(let i=c.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[c[i],c[j]]=[c[j],c[i]];}return c;}
function maitrisees(liste){ return (liste||REGLES).filter(r=>fiche(r.id).b>=4).length; }
function niveau(){
  const p = maitrisees()/REGLES.length;
  if(p>=.9) return "Expert"; if(p>=.7) return "Confirmé";
  if(p>=.45) return "Solide"; if(p>=.2) return "En progrès"; return "Débutant";
}
function decouper(phrase){
  return phrase.split(' ').map(brut=>{
    const cible = brut.includes('[');
    const nu = brut.replace('[','').replace(']','');
    const m = nu.match(/^([«"']*)(.+?)([.,;:!?»"']*)$/);
    return {avant:m[1], mot:m[2], apres:m[3], cible};
  });
}
function tirerPhrase(r){
  const f = fiche(r.id);
  const choix = r.p.map((_,i)=>i).filter(i=>i!==f.derniere);
  const i = choix[(Math.random()*choix.length)|0];
  f.derniere = i;
  return r.p[i];
}
function echapper(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ═══════════ PLANIFICATION (répétition espacée) ═══════════ */
function construireSession(n, cat){
  const bassin = cat ? REGLES.filter(r=>r.cat===cat) : REGLES;
  const dues = [], neuves = [], reste = [];
  bassin.forEach(r=>{
    const f = fiche(r.id);
    if(f.neuf) neuves.push(r);
    else if(f.du <= etat.compteur) dues.push(r);
    else reste.push(r);
  });
  dues.sort((a,b)=> (fiche(a.id).b - fiche(b.id).b) || (fiche(a.id).du - fiche(b.id).du));
  const liste = dues.slice(0, n);
  neuves.sort((a,b)=> a.n - b.n);                     // les plus simples d'abord
  const place = Math.min(NEUVES_MAX, n - liste.length);
  for(let i=0;i<place && i<neuves.length;i++) liste.push(neuves[i]);
  reste.sort((a,b)=> fiche(a.id).du - fiche(b.id).du);
  for(const r of reste){ if(liste.length>=n) break; liste.push(r); }
  for(const r of neuves){ if(liste.length>=n) break; if(!liste.includes(r)) liste.push(r); }
  return melanger(liste);
}
function noter(id, bon){
  const f = fiche(id);
  f.neuf = false; f.vus++; if(bon) f.ok++;
  f.b = bon ? Math.min(5, f.b+1) : Math.max(0, f.b-2);
  etat.compteur++;
  f.du = etat.compteur + INTERVALLES[f.b];
}
function construireTest(){
  const paquets = CATS.map(c=>melanger(REGLES.filter(r=>r.cat===c)).sort((a,b)=>a.n-b.n));
  const liste = []; let i = 0;
  while(liste.length < TAILLE_TEST && i < 40){
    for(const p of paquets){ if(p[i]){ liste.push(p[i]); if(liste.length>=TAILLE_TEST) break; } }
    i++;
  }
  return melanger(liste);
}

  const m = maitrisees(), tot = REGLES.length;
