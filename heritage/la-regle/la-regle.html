  const neuves = REGLES.filter(r=>fiche(r.id).neuf).length;

  const puces = CATS.map(c=>{
    const liste = REGLES.filter(r=>r.cat===c);
    return `<button class="puce ${filtre===c?'active':''}" data-cat="${c}">${c}
      <i>${maitrisees(liste)}/${liste.length}</i></button>`;
  }).join('');

  scene.innerHTML = `
    <div class="carte">
      <p class="niveau"><b>${niveau()}</b><span>Niveau estimé</span></p>
      <div class="anneau"><i style="width:${m/tot*100}%"></i></div>
      <p class="legende">${m} règle${m>1?'s':''} maîtrisée${m>1?'s':''} sur ${tot} ·
        ${dues} à réviser${neuves>0?` · ${neuves} jamais vue${neuves>1?'s':''}`:''}</p>
    </div>
    ${etat.testFait ? '' : `
    <div class="carte" style="border-left:3px solid var(--or)">
      <p class="legende" style="color:var(--craie)">Commence par le test de positionnement : ${TAILLE_TEST} phrases pour situer ton niveau dans chaque domaine et calibrer le parcours.</p>
      <button class="plein" id="lancer-test" style="margin-top:16px">Passer le test</button>
    </div>`}

    <div class="carte">
      <p class="etiquette">Cibler un domaine</p>
      <div class="puces">
        <button class="puce ${filtre===null?'active':''}" data-cat="">Tout mélanger</button>
        ${puces}
      </div>
      <p class="etiquette" style="margin-top:22px">Longueur de la série</p>
      <div class="puces">
        ${TAILLES.map(t=>`<button class="puce ${etat.taille===t?'active':''}" data-taille="${t}">${t} phrases</button>`).join('')}
      </div>
      <button class="plein" id="go-entrainement" style="margin-top:22px">Commencer l'entraînement</button>
    </div>

    <div class="menu">
      <button class="tuile" id="go-dictee">
        <b>Dictée audio</b><span>${DICTEES.length} phrases lues à voix haute, corrigées mot à mot.</span></button>
      <button class="tuile" id="go-stats">
        <b>Statistiques</b><span>Ton palier règle par règle et tes lacunes en tête de liste.</span></button>
      <button class="tuile" id="go-regles">
        <b>Les règles</b><span>Les ${tot} difficultés du parcours, à consulter librement.</span></button>
      <button class="tuile" id="go-faiblesses">
        <b>Mes points faibles</b><span>Une série composée uniquement de ce que tu rates.</span></button>
    </div>

    <div class="bas">
      <button class="lien" id="raz">Effacer ma progression</button>
      ${sauvegardeOK ? '' : '<span class="avert">Sauvegarde indisponible : la progression sera perdue en fermant.</span>'}
    </div>`;

  scene.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ filtre = b.dataset.cat || null; accueil(); });
  scene.querySelectorAll('[data-taille]').forEach(b=>b.onclick=async()=>{ etat.taille = +b.dataset.taille; await sauver(); accueil(); });
  const bt = document.getElementById('lancer-test');
  if(bt) bt.onclick = ()=>lancerSerie(construireTest(), true);
  document.getElementById('go-entrainement').onclick = ()=>lancerSerie(construireSession(etat.taille, filtre), false);
  document.getElementById('go-faiblesses').onclick = ()=>{
    const faibles = REGLES.filter(r=>{const f=fiche(r.id); return !f.neuf && f.b<=2;});
    if(!faibles.length){ alert("Aucune faiblesse enregistrée pour l'instant : lance une série normale."); return; }
    lancerSerie(melanger(faibles).slice(0, etat.taille), false);
  };
  document.getElementById('go-dictee').onclick = dicteeAccueil;
  document.getElementById('go-stats').onclick = stats;
  document.getElementById('go-regles').onclick = catalogue;
  document.getElementById('raz').onclick = async ()=>{
    etat = etatNeuf(); REGLES.forEach(r=>fiche(r.id)); await sauver(); accueil();
  };
}

/* ═══════════ ÉCRAN : SÉRIE DE QUESTIONS ═══════════ */
let serie = [], curseur = 0, justes = 0, releve = {}, modeTest = false;

function lancerSerie(liste, test){
  serie = liste; curseur = 0; justes = 0; releve = {}; modeTest = test;
  fil.textContent = test ? "Test de positionnement" : "Entraînement";
  accroche.textContent = test
    ? "Ne devine pas : si tu hésites, réponds au mieux, ça sert à te situer."
    : "Clique sur le mot fautif, ou déclare la phrase correcte.";
  question();
}

function question(){
  if(curseur >= serie.length) return bilan();
  const r = serie[curseur];
  const ph = tirerPhrase(r);
  const jetons = decouper(ph.s);

  scene.innerHTML = `
    <div class="jauge">
      <div class="barre"><span style="width:${curseur/serie.length*100}%"></span></div>
      <p class="compte"><b>${curseur}</b> / ${serie.length}</p>
    </div>
    <div class="cahier" id="cahier">
      <div class="marge"></div>
      <p class="categorie">${r.cat}</p>
      <p class="phrase" id="phrase"></p>
      <svg class="calque" id="calque"></svg>
    </div>
    <div class="consigne">
      <p class="indice">Clique sur le mot qui te semble fautif.</p>
      <button class="creux" id="rien">Aucune faute</button>
    </div>
    <div id="retour"></div>`;

  const phrase = document.getElementById('phrase');
  jetons.forEach((j,i)=>{
    if(j.avant) phrase.append(j.avant);
    const b = document.createElement('button');
    b.className='mot'; b.textContent=j.mot; b.dataset.i=i;
    b.onclick = ()=>repondre(r, ph, jetons, i, b);
    phrase.append(b);
    if(j.apres) phrase.append(j.apres);
    phrase.append(' ');
  });
  document.getElementById('rien').onclick = ()=>repondre(r, ph, jetons, -1, null);
}

async function repondre(r, ph, jetons, choix, bouton){
  const phrase = document.getElementById('phrase');
  phrase.parentElement.classList.add('fige');
  document.getElementById('rien').disabled = true;
  phrase.querySelectorAll('.mot').forEach(b=>b.disabled=true);

  const iFaute = jetons.findIndex(j=>j.cible);
  const bon = (ph.fix === null) ? (choix === -1) : (choix === iFaute);
  if(bon) justes++;
  const c = releve[r.cat] || (releve[r.cat]={bon:0,tot:0});
  c.tot++; if(bon) c.bon++;

  const avant = fiche(r.id).b;
  noter(r.id, bon);
  const apres = fiche(r.id).b;
  await sauver();

  if(!bon && bouton) bouton.classList.add('rate');
  if(iFaute > -1) entourer(phrase.querySelector('[data-i="'+iFaute+'"]'), ph.fix);

  const verdict = bon ? "Juste" : (ph.fix===null ? "La phrase était correcte" : "Ce n'était pas ça");
  const palier = modeTest ? "" :
    (apres>=4 && avant<4 ? "Règle maîtrisée" : (apres>avant ? `Palier ${apres} / 5` : `Retour au palier ${apres} / 5`));

  document.getElementById('retour').innerHTML = `
    <div class="regle ${bon?'juste':''}">
      <p class="verdict"><span>${verdict}</span><span class="palier">${palier}</span></p>
      <h2>${r.t}</h2>
      <p>${r.r}</p>
      <p class="astuce">${r.astuce}</p>
      <button class="plein suite" id="suite">${curseur+1<serie.length?'Phrase suivante':'Voir le bilan'}</button>
    </div>`;
  const s = document.getElementById('suite');
  s.onclick = ()=>{ curseur++; question(); };
  s.focus();
}

function entourer(el, correction){
  if(!el) return;
  const calque = document.getElementById('calque');
  const cahier = document.getElementById('cahier');
  const b = el.getBoundingClientRect(), c = cahier.getBoundingClientRect();
  const x=b.left-c.left, y=b.top-c.top, cx=x+b.width/2, cy=y+b.height/2;
  const rx=b.width/2+11, ry=b.height/2+3, k=0.5523;
  const d = `M ${cx} ${cy-ry}
    C ${cx+rx*k} ${cy-ry} ${cx+rx} ${cy-ry*k} ${cx+rx} ${cy}
    C ${cx+rx} ${cy+ry*k} ${cx+rx*k} ${cy+ry} ${cx} ${cy+ry}
    C ${cx-rx*k} ${cy+ry} ${cx-rx} ${cy+ry*k} ${cx-rx} ${cy}
    C ${cx-rx} ${cy-ry*k} ${cx-rx*k} ${cy-ry*1.08} ${cx+rx*0.3} ${cy-ry*0.98}`;
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); p.setAttribute('class','trait');
  p.setAttribute('transform',`rotate(-2 ${cx} ${cy})`);
  calque.append(p);
  const L = p.getTotalLength();
  p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
  if(correction){
    const a = document.createElement('span');
    a.className='annote'; a.textContent=correction;
    a.style.left = cx+'px'; a.style.top = (y-4)+'px';
    cahier.append(a);
  }
}

async function bilan(){
  if(modeTest) etat.testFait = true;
  etat.sessions.push({q:serie.length, ok:justes});
  if(etat.sessions.length>40) etat.sessions.shift();
  await sauver();

  const lignes = Object.entries(releve).map(([cat,c])=>`
    <div class="ligne">
      <div class="tete"><span>${cat}</span><span>${c.bon} / ${c.tot}</span></div>
      <div class="piste"><i class="${c.bon/c.tot>=.75?'fort':(c.bon/c.tot<.5?'faible':'')}" style="width:${c.bon/c.tot*100}%"></i></div>
    </div>`).join('');

  const faibles = serie.filter(r=>fiche(r.id).b<=1).slice(0,5);

  scene.innerHTML = `
    <div class="carte">
      <p class="note">${justes}<small> / ${serie.length}</small></p>
      <p class="legende" style="margin:6px 0 26px">
        ${modeTest ? `Ton parcours est calibré. Niveau estimé : <b style="color:var(--papier)">${niveau()}</b>.`
                   : `Niveau estimé : <b style="color:var(--papier)">${niveau()}</b> · ${maitrisees()} / ${REGLES.length} règles maîtrisées.`}
      </p>
      ${lignes}
      ${faibles.length ? `<h3>À retravailler en priorité</h3>
        <p class="legende">${faibles.map(r=>r.t).join(' · ')}</p>` : ''}
      <div class="bas">
        <button class="plein" id="encore">${modeTest?"Commencer l'entraînement":"Nouvelle série"}</button>
        <button class="creux" id="retour-accueil">Accueil</button>
      </div>
    </div>`;
  document.getElementById('encore').onclick = ()=>lancerSerie(construireSession(etat.taille, filtre), false);
  document.getElementById('retour-accueil').onclick = accueil;
}

/* ═══════════ ÉCRAN : STATISTIQUES ═══════════ */
function stats(){
  fil.textContent = "Statistiques";
  accroche.textContent = "Un palier se gagne à chaque bonne réponse et se perd de deux crans en cas d'erreur.";

  const vues = REGLES.filter(r=>!fiche(r.id).neuf);
  const pires = vues.slice().sort((a,b)=> fiche(a.id).b - fiche(b.id).b || (fiche(a.id).ok/fiche(a.id).vus) - (fiche(b.id).ok/fiche(b.id).vus)).slice(0,8);

  const bloc = CATS.map(cat=>{
    const liste = REGLES.filter(r=>r.cat===cat);
    return `<h3>${cat} <span style="font-family:'Karla';font-size:12px;color:var(--mauve);letter-spacing:.1em">${maitrisees(liste)}/${liste.length}</span></h3>
    ${liste.map(r=>{
      const f = fiche(r.id);
      const info = f.neuf ? 'jamais vue' : `palier ${f.b}/5 · ${f.ok}/${f.vus}`;
      return `<div class="ligne">
        <div class="tete"><span>${r.t}</span><span>${info}</span></div>
        <div class="piste"><i class="${f.b>=4?'fort':(f.b<=1&&!f.neuf?'faible':'')}" style="width:${f.b/5*100}%"></i></div>
      </div>`;
    }).join('')}`;
  }).join('');

  const s = etat.sessions.slice(-12);
  const total = s.reduce((a,x)=>a+x.q,0), reussi = s.reduce((a,x)=>a+x.ok,0);

  scene.innerHTML = `
    <div class="carte">
      <p class="niveau"><b>${niveau()}</b><span>${maitrisees()} / ${REGLES.length} maîtrisées</span></p>
      <p class="legende" style="margin-top:10px">
        ${total ? `${Math.round(reussi/total*100)} % de réussite sur tes ${s.length} dernières séries · ${etat.compteur} phrases traitées en tout.` : 'Aucune série terminée pour le moment.'}
      </p>
    </div>
    ${pires.length ? `<div class="carte">
      <h3>Tes points faibles du moment</h3>
      ${pires.map(r=>{const f=fiche(r.id);return `<div class="ligne">
        <div class="tete"><span>${r.t}</span><span>${r.cat} · palier ${f.b}/5</span></div>
        <div class="piste"><i class="${f.b<=1?'faible':''}" style="width:${f.b/5*100}%"></i></div></div>`;}).join('')}
      <button class="plein" id="attaquer" style="margin-top:18px">S'entraîner là-dessus</button>
    </div>` : ''}
    <div class="carte">${bloc}</div>
    <div class="bas"><button class="creux" id="retour-accueil">Accueil</button></div>`;

  const a = document.getElementById('attaquer');
  if(a) a.onclick = ()=>lancerSerie(melanger(pires.concat(pires)).slice(0, etat.taille), false);
  document.getElementById('retour-accueil').onclick = accueil;
}

/* ═══════════ ÉCRAN : CATALOGUE DES RÈGLES ═══════════ */
let catCatalogue = null;
function catalogue(){
  fil.textContent = "Les règles";
  accroche.textContent = "Toutes les difficultés du parcours, avec leur astuce de vérification.";
  const liste = REGLES.filter(r=>!catCatalogue || r.cat===catCatalogue);
  scene.innerHTML = `
    <div class="carte">
      <div class="puces">
        <button class="puce ${catCatalogue===null?'active':''}" data-c="">Toutes</button>
        ${CATS.map(c=>`<button class="puce ${catCatalogue===c?'active':''}" data-c="${c}">${c}</button>`).join('')}
      </div>
    </div>
    <div class="carte">
      ${liste.map(r=>{
        const f = fiche(r.id);
        return `<div class="fiche">
          <p class="fiche-t">${r.t} <em>${'●'.repeat(r.n)}</em></p>
          <p class="legende" style="line-height:1.6">${r.r}</p>
          <p class="legende astuce">${r.astuce}</p>
          <p class="fiche-e">${f.neuf?'jamais travaillée':`palier ${f.b}/5`}</p>
        </div>`;
      }).join('')}
    </div>
    <div class="bas"><button class="creux" id="retour-accueil">Accueil</button></div>`;
  scene.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ catCatalogue = b.dataset.c || null; catalogue(); });
  document.getElementById('retour-accueil').onclick = accueil;
}

/* ═══════════ ÉCRAN : DICTÉE ═══════════ */
function normaliser(t){ return t.replace(/[’´]/g,"'").replace(/[«»"]/g,'').replace(/\s+/g,' ').trim(); }
function mots(t){
  return normaliser(t).split(' ')
    .map(m=>m.replace(/^[.,;:!?()]+|[.,;:!?()]+$/g,''))
    .filter(Boolean);
}
function dicteeAccueil(){
  fil.textContent = "Dictée audio";
  accroche.textContent = "Écoute, écris, puis compare mot à mot. Les accents comptent.";
  const faites = Object.keys(etat.dictees).length;
  const parfaites = Object.values(etat.dictees).filter(s=>s===100).length;
  scene.innerHTML = `
    <div class="carte">
      <p class="legende">${faites} dictée${faites>1?'s':''} travaillée${faites>1?'s':''} sur ${DICTEES.length}${parfaites?` · ${parfaites} sans faute`:''}.</p>
      <div class="menu" style="margin-top:18px">
        ${DICTEES.map((_,i)=>{
          const sc = etat.dictees[i];
          return `<button class="tuile" data-d="${i}">
            <b>Dictée ${i+1}</b><span>${sc!==undefined?`Meilleur score : ${sc} %`:'Jamais tentée'}</span></button>`;
        }).join('')}
      </div>
    </div>
    <div class="bas"><button class="creux" id="retour-accueil">Accueil</button></div>`;
  scene.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>dictee(+b.dataset.d));
  document.getElementById('retour-accueil').onclick = accueil;
}

function dictee(i){
  const texte = DICTEES[i];
  const dispo = 'speechSynthesis' in window;
  fil.textContent = `Dictée ${i+1} sur ${DICTEES.length}`;
  scene.innerHTML = `
    <div class="ardoise">
      <textarea id="saisie" placeholder="Écris la phrase que tu entends…" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
    </div>
    <div class="haut-parleur">
      <button class="creux" id="ecouter">Réécouter</button>
      <button class="creux" id="lent">Lentement</button>
      <button class="plein" id="corriger" style="margin-left:auto">Corriger</button>
    </div>
    ${dispo?'':'<p class="avert">La synthèse vocale est indisponible ici. Demande à quelqu\'un de te dicter la phrase, ou passe à l\'entraînement.</p>'}
    <div id="verdict"></div>
    <div class="bas"><button class="creux" id="retour-dictees">Retour aux dictées</button></div>`;

  const dire = (vitesse)=>{
    if(!dispo) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = 'fr-FR'; u.rate = vitesse;
    const v = speechSynthesis.getVoices().find(x=>x.lang && x.lang.startsWith('fr'));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  };
  document.getElementById('ecouter').onclick = ()=>dire(0.95);
  document.getElementById('lent').onclick = ()=>dire(0.6);
  document.getElementById('retour-dictees').onclick = ()=>{ if(dispo) speechSynthesis.cancel(); dicteeAccueil(); };
  document.getElementById('saisie').focus();
  setTimeout(()=>dire(0.95), 400);

  document.getElementById('corriger').onclick = async ()=>{
    if(dispo) speechSynthesis.cancel();
    const attendu = mots(texte), donne = mots(document.getElementById('saisie').value);
    let bons = 0;
    const rendu = attendu.map((m,j)=>{
      const d = donne[j];
      if(d && d.toLowerCase() === m.toLowerCase()){ bons++; return `<span class="ok">${echapper(m)}</span>`; }
      return `${d?`<span class="ko">${echapper(d)}</span>`:''}<span class="vrai">${echapper(m)}</span>`;
    }).join(' ');
    const score = Math.round(bons/attendu.length*100);
    if(etat.dictees[i] === undefined || score > etat.dictees[i]){ etat.dictees[i] = score; await sauver(); }

    document.getElementById('verdict').innerHTML = `
      <div class="regle ${score===100?'juste':''}" style="margin-top:18px">
        <p class="verdict"><span>${score===100?'Sans faute':`${bons} mots justes sur ${attendu.length}`}</span><span class="palier">${score} %</span></p>
        <div class="ardoise" style="margin-top:14px"><p class="correction">${rendu}</p></div>
        <p class="astuce" style="margin-top:16px">En rouge barré ce que tu as écrit, en vert la forme attendue.</p>
        ${i+1<DICTEES.length?'<button class="plein suite" id="dictee-suivante">Dictée suivante</button>':''}
      </div>`;
    const n = document.getElementById('dictee-suivante');
    if(n) n.onclick = ()=>dictee(i+1);
  };
}

  scene.innerHTML = '<p class="legende">Chargement de ta progression…</p>';
  await charger();
